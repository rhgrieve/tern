name: Release

# A tag like v0.1.0 becomes a release with the build attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tern-x86_64*
          merge-multiple: true
      - name: The tag has to name the version that was built
        env:
          TAG: ${{ github.ref_name }}
        run: test -f "tern-${TAG#v}-x86_64.tar.gz"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tar.gz
            *.AppImage
            *.flatpak
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # What the changes file says of this version.
          awk -v version="${TAG#v}" '/^## /{on = ($2 == version); next} on' source/CHANGELOG.md >notes.md
          grep -q . notes.md
          gh release create "$TAG" ./*.tar.gz ./*.AppImage ./*.flatpak ./*.sha256 \
            --verify-tag --prerelease --notes-file notes.md --title "Tern ${TAG#v}"
