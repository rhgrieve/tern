name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST: 1.100.0
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # The oldest system with a long life that has libadwaita 1.8. What is built here runs on newer ones.
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install what the build needs
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -qy --no-install-recommends \
            ca-certificates git curl build-essential cmake clang pkg-config python3 rustup \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libgtk-4-bin \
            adwaita-icon-theme fonts-noto-core fonts-noto-color-emoji tzdata dbus >/dev/null
          rustup toolchain install "$RUST" --profile minimal -c clippy -c rustfmt
          rustup default "$RUST"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not for releases: they are built from nothing but the source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref_type != 'tag'
        with:
          path: |
            /opt/cargo/registry
            target
          key: build-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            build-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}-
            build-${{ env.RUST }}-

      # The vendored engine keeps its own style.
      - name: Style
        run: |
          own=(-p tern -p ternd -p tern-cli -p tern-login -p tern-auth -p tern-engine -p tern-ipc -p tern-presence)
          cargo fmt "${own[@]}" --check
          cargo clippy --locked "${own[@]}" --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Tests that need a display
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":9"
          GTK_USE_PORTAL: "0"
          ADW_DISABLE_PORTAL: "1"
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          gtk4-broadwayd :9 & sleep 2
          # GTK wants one thread for all it does, so each test gets a process.
          for test in $(cargo test --locked -q -p tern --lib -- --ignored --list --format terse | sed -n 's/: test$//p'); do
            echo "$test"
            timeout 120 cargo test --locked -q -p tern --lib "$test" -- --ignored --exact --nocapture
          done

      - name: Build
        run: cargo build --locked --release --workspace

      - name: Put it together
        run: packaging/archive.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tern-x86_64
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  # What was built has to start on the systems people have.
  try:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: ubuntu:26.04
            install: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy libgtk-4-1 libadwaita-1-0 libwebkitgtk-6.0-4 libgtk-4-bin
          - system: fedora:43
            install: dnf -qy install gtk4 libadwaita webkitgtk6.0 procps-ng
          - system: fedora:44
            install: dnf -qy install gtk4 libadwaita webkitgtk6.0 procps-ng
          - system: archlinux:latest
            install: pacman -Syu --noconfirm --needed gtk4 libadwaita webkitgtk-6.0
    container: ${{ matrix.system }}
    name: try (${{ matrix.system }})
    steps:
      - name: Install what Tern needs
        run: |
          ${{ matrix.install }} >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tern-x86_64
      - name: Install and start
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":9"
          GTK_USE_PORTAL: "0"
          ADW_DISABLE_PORTAL: "1"
        run: |
          export HOME=$(mktemp -d) XDG_RUNTIME_DIR=$(mktemp -d)
          sha256sum -c ./*.sha256
          tar xzf ./*.tar.gz
          cd tern-*/
          ./install.sh --no-service
          "$HOME/.local/bin/tern-cli" --version
          gtk4-broadwayd :9 & sleep 2
          for try in 1 2 3 4; do
            timeout 60 "$HOME/.local/bin/tern" --demo --open c4 --screenshot shot.png || true
            [ -s shot.png ] && break
          done
          test -s shot.png
          ./uninstall.sh --no-service
          test ! -e "$HOME/.local/bin/tern"
