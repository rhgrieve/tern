name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST: 1.100.0
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # The oldest system with a long life that has libadwaita 1.8. What is built here runs on newer ones.
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - name: Install what the build needs
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -qy --no-install-recommends \
            ca-certificates git curl unzip build-essential cmake clang pkg-config python3 rustup squashfs-tools desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libgtk-4-bin libasound2-dev \
            adwaita-icon-theme fonts-noto-core fonts-noto-color-emoji tzdata dbus >/dev/null
          rustup toolchain install "$RUST" --profile minimal -c clippy -c rustfmt
          rustup default "$RUST"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not on main, whose builds become releases: they are built from nothing but the source.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref != 'refs/heads/main'
        with:
          path: |
            /opt/cargo/registry
            target
          key: build-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            build-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}-
            build-${{ env.RUST }}-

      # Calls are built against a prebuilt WebRTC, checked against its sha256.
      - name: WebRTC
        run: scripts/webrtc.sh

      # The vendored engine keeps its own style.
      - name: Style
        run: |
          own=(-p tern -p ternd -p tern-cli -p tern-login -p tern-auth -p tern-engine -p tern-ipc -p tern-presence -p tern-call)
          cargo fmt "${own[@]}" --check
          cargo clippy --locked "${own[@]}" --all-targets --no-deps -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Tests that need a display
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":9"
          GTK_USE_PORTAL: "0"
          ADW_DISABLE_PORTAL: "1"
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          # Not left behind: a step ends when nobody holds its output any more.
          gtk4-broadwayd :9 >/dev/null 2>&1 & display=$!
          trap 'kill $display' EXIT
          sleep 2
          # GTK wants one thread for all it does, so each test gets a process. Those that need
          # the Flatpak are run from inside one.
          for test in $(cargo test --locked -q -p tern --lib -- --ignored --list --format terse | sed -n 's/: test$//p' | grep -v '::from_the_flatpak_'); do
            echo "$test"
            timeout 120 cargo test --locked -q -p tern --lib "$test" -- --ignored --exact --nocapture
          done

      - name: Build
        run: cargo build --locked --release --workspace

      # Built on a newer glibc than some systems tried below have: Fedora 43's is 2.42.
      - name: Runs on older glibc
        run: |
          for program in tern ternd tern-cli tern-login tern-call; do
            newest=$(objdump -T "target/release/$program" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n -u | tail -1)
            echo "$program needs $newest"
            [ "${newest#GLIBC_2.}" -le 42 ]
          done

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            /opt/cargo/registry
            target
          key: build-${{ env.RUST }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

      - name: Put it together
        run: |
          packaging/archive.sh
          packaging/appimage.sh
          desktop-file-validate packaging/desktop/*.desktop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tern-x86_64
          path: |
            dist/*.tar.gz*
            dist/*.AppImage*
          if-no-files-found: error
          retention-days: 90

  # What was built has to start on the systems people have.
  try:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: ubuntu:26.04
            install: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -qy libgtk-4-1 libadwaita-1-0 libwebkitgtk-6.0-4 libasound2t64 libgtk-4-bin
          - system: fedora:43
            install: dnf -qy install gtk4 libadwaita webkitgtk6.0 alsa-lib procps-ng
          - system: fedora:44
            install: dnf -qy install gtk4 libadwaita webkitgtk6.0 alsa-lib procps-ng
          - system: archlinux:latest
            install: pacman -Syu --noconfirm --needed gtk4 libadwaita webkitgtk-6.0 alsa-lib
    container: ${{ matrix.system }}
    name: try (${{ matrix.system }})
    steps:
      - name: Install what Tern needs
        run: |
          ${{ matrix.install }} >/dev/null
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tern-x86_64
      - name: Install and start
        env:
          GDK_BACKEND: broadway
          BROADWAY_DISPLAY: ":9"
          GTK_USE_PORTAL: "0"
          ADW_DISABLE_PORTAL: "1"
        run: |
          export HOME=$(mktemp -d) XDG_RUNTIME_DIR=$(mktemp -d)
          cat ./*.sha256 | sha256sum -c
          image=$PWD/$(echo *.AppImage)
          chmod +x "$image"
          tar xzf ./*.tar.gz
          cd tern-*/
          ./install.sh --no-service
          "$HOME/.local/bin/tern-cli" --version
          # Not left behind: a step ends when nobody holds its output any more.
          gtk4-broadwayd :9 >/dev/null 2>&1 & display=$!
          trap 'kill $display' EXIT
          sleep 2
          picture() {
            for try in 1 2 3 4; do
              timeout 60 "$@" --demo --open c4 --screenshot "$PWD/shot.png" || true
              [ -s shot.png ] && break
            done
            test -s shot.png
            rm shot.png
          }
          picture "$HOME/.local/bin/tern"
          # Containers cannot mount it.
          picture "$image" --appimage-extract-and-run
          "$image" --appimage-extract-and-run --cli --version
          ./uninstall.sh --no-service
          test ! -e "$HOME/.local/bin/tern"

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tern-x86_64
          path: dist
      - name: Install Flatpak
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy flatpak xvfb dbus-x11 appstream >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
      - name: Put it together
        run: |
          appstreamcli validate --no-net packaging/desktop/*.metainfo.xml
          tar -C dist -xzf dist/*.tar.gz
          packaging/flatpak.sh
      - name: Install and start
        env:
          ID: io.github.rhgrieve.Tern
        run: |
          flatpak install --user -y --noninteractive dist/*.flatpak
          missing=$(flatpak run --command=sh "$ID" -c 'ldd /app/bin/*' | grep 'not found' || true)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
          for try in 1 2 3 4; do
            timeout 60 xvfb-run -a flatpak run --nosocket=wayland --socket=x11 --env=GSK_RENDERER=cairo \
              --filesystem="$PWD" "$ID" --demo --open c4 --screenshot "$PWD/shot.png" || true
            [ -s shot.png ] && break
          done
          test -s shot.png
          # Each of these is a sandbox of its own, and they still have to find each other.
          cat >talk.sh <<'END'
          flatpak run --env=TERN_NO_PRESENCE=1 --command=ternd "$ID" >service.log 2>&1 & service=$!
          for try in $(seq 20); do
            flatpak run --command=tern-cli "$ID" status >status.log 2>&1 && break
            sleep 1
          done
          cat status.log
          kill $service
          grep -qi 'not signed in' status.log
          END
          timeout 120 dbus-run-session -- bash -e talk.sh || { cat service.log; exit 1; }
      # What the other two do, the Flatpak does: see CLAUDE.md.
      - name: Does all that the others do
        env:
          ID: io.github.rhgrieve.Tern
        run: |
          permissions=$(flatpak info --show-permissions "$ID")
          for want in pulseaudio org.freedesktop.Flatpak org.freedesktop.Notifications \
              org.freedesktop.login1; do
            grep -q "$want" <<<"$permissions" || { echo "the Flatpak lacks $want"; exit 1; }
          done
          cat >host.sh <<'END'
          # Programs of the computer are reached, and the sound players are in the sandbox.
          flatpak run --command=sh "$ID" -c 'flatpak-spawn --host --directory="$HOME" true'
          flatpak run --command=sh "$ID" -c 'command -v paplay && command -v pw-play'
          END
          timeout 60 dbus-run-session -- bash -e host.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tern-x86_64-flatpak
          path: dist/*.flatpak*
          if-no-files-found: error
          retention-days: 90

  # Says that these files come from this commit and this workflow. A release checks it.
  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, try, flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tern-x86_64*
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.tar.gz
            *.AppImage
            *.flatpak
