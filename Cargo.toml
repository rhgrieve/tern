[workspace]
members = ["crates/*", "vendor/engine/session", "vendor/engine/chatsvc", "vendor/engine/graph", "vendor/engine/core", "vendor/engine/store", "vendor/engine/calling"]
exclude = ["vendor/native"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22"
directories = "6"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.23"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }

tern-auth = { path = "crates/auth" }
tern-engine = { path = "crates/engine" }
tern-ipc = { path = "crates/ipc" }
tern-presence = { path = "crates/presence" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

session = { path = "vendor/engine/session" }
chatsvc = { path = "vendor/engine/chatsvc" }
graph = { path = "vendor/engine/graph" }
store = { path = "vendor/engine/store" }
calling = { path = "vendor/engine/calling" }
teams-core = { path = "vendor/engine/core" }

[patch.crates-io]
webrtc-sys = { path = "vendor/native/webrtc-sys" }
libwebrtc = { path = "vendor/native/libwebrtc" }

[profile.dev]
debug = "line-tables-only"
